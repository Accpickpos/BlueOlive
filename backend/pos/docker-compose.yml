"""
POS FastAPI - Docker configuration
"""
version: '3.8'

services:
  pos-api:
    build: .
    container_name: pos-api
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/blueolive
      - DRF_BASE_URL=http://django:8000/api
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8001
      - DEBUG=False
    depends_on:
      - postgres
    volumes:
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  postgres:
    image: postgres:15
    container_name: pos-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blueolive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
