[pytest]
# Pytest configuration for BlueOlive Django project

# Django settings module
DJANGO_SETTINGS_MODULE = core.settings

# Python paths
python_paths = backend/core

# Test discovery patterns
python_files = tests.py test_*.py *_tests.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = 
    apps
    tenancy
    shop_users
    core

# Ignore paths
norecursedirs = 
    migrations
    __pycache__
    *.pyc
    .git
    .tox
    venv
    env
    .venv
    .env
    static
    staticfiles
    media

# Add custom options
addopts = 
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    smoke: marks tests as smoke tests for quick validation

# Coverage options
[coverage:run]
omit =
    */migrations/*
    */tests/*
    */test_*.py
    *_test.py
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
