services:
  backend:
    build:
      context: ./backend/core
    container_name: blueolive-backend
    mem_limit: 2g
    shm_size: 256m
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py create_dev_tenant --slug dev --create-shop &&
      python manage.py migrate_all_tenants &&
      python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend/core:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/core/.env
    depends_on:
      - postgres
      - redis
    networks:
      - blueolive_network
    restart: unless-stopped

  celery:
    build:
      context: ./backend/core
    container_name: blueolive-celery
    mem_limit: 1g
    shm_size: 128m
    command: sh -c "sleep 5 && celery -A core worker --loglevel=info"
    volumes:
      - ./backend/core:/app
    env_file:
      - ./backend/core/.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - blueolive_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: blueolive-frontend
    mem_limit: 4g
    shm_size: 512m
    working_dir: /app
    command: sh -c "NODE_OPTIONS='--max-old-space-size=3072' npm run dev"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - blueolive_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blueolive-redis
    ports:
      - "6379:6379"
    networks:
      - blueolive_network
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: blueolive-postgres
    restart: unless-stopped
    env_file:
      - ./backend/core/.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - blueolive_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  redis_data:

networks:
  blueolive_network:
    driver: bridge
